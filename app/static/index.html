<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FilmaxWeb — 我的影音庫</title>
<link rel="stylesheet" href="/static/vendor/photoswipe/photoswipe.css">
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🎬</text></svg>">
</head>
<body>

<header>
  <div class="brand"><i>F</i>FilmaxWeb</div>
  <nav>
    <button data-kind="" class="on">全部</button>
    <button data-kind="movie">電影</button>
    <button data-kind="tv">影集</button>
    <button data-kind="photo">相片</button>
    <button data-kind="doc">文件</button>
  </nav>
  <div class="spacer"></div>
  <div class="search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="搜尋片名或檔名…" autocomplete="off">
  </div>
  <button class="btn" id="btnScan">掃描媒體庫</button>
  <button class="btn" id="btnStats" title="狀態">ⓘ</button>
  <a class="btn admin-link" id="btnAdmin" href="/admin" title="管理後台" hidden>管理後台</a>
  <button class="btn" id="btnAccount" title="帳號">
    <span id="acctBadge" class="badge" hidden></span><span id="acctName">帳號</span>
  </button>
</header>

<div class="toolbar">
  <div class="chips" id="genres"></div>
  <select class="sort" id="sort">
    <option value="added">最近加入</option>
    <option value="title">片名</option>
    <option value="year">年份</option>
    <option value="rating">評分</option>
  </select>
</div>

<main>
  <div id="continue"></div>
  <div class="section-title" id="libTitle">媒體庫 <span id="libCount"></span></div>
  <div class="grid" id="grid"></div>
  <div id="pager"></div>

  <!-- 文件牆（PDF）。跟影片、相片共用同一塊區域。
       資料夾有 452 個、深達 7～8 層，所以走側欄樹狀導覽而不是平鋪標籤。 -->
  <div id="docView" hidden>
    <button class="tree-toggle" id="docTreeToggle" aria-expanded="false"
            aria-controls="docTree">📁 <span id="docTreeLabel">選擇資料夾</span></button>
    <div class="split">
      <aside class="tree-pane" id="docTree">
        <div class="tree-search">
          <input id="docFolderQ" type="search" placeholder="篩選資料夾…" autocomplete="off">
        </div>
        <div class="tree" id="docTreeBody" role="tree" aria-label="文件資料夾"></div>
      </aside>
      <div class="split-main">
        <nav class="crumbs" id="docCrumbs" aria-label="目前位置"></nav>
        <div class="section-title" id="docTitle">文件 <span id="docCount"></span></div>
        <div class="dgrid" id="dgrid"></div>
        <div id="dpager"></div>
      </div>
    </div>
  </div>

  <!-- 相片牆。跟影片共用同一塊區域，切分頁時互相顯示/隱藏。
       相簿只有十幾個而且全在同一層，所以維持封面標籤（縮圖才是相簿最好認的
       線索），不像文件牆那樣走樹狀 —— 那邊是 452 個、深達 7～8 層。 -->
  <div id="photoView" hidden>
    <div class="album-bar">
      <input id="photoFolderQ" type="search" placeholder="篩選相簿…" autocomplete="off">
      <select class="sort" id="photoSort">
        <option value="taken">最新</option>
        <option value="name">名稱</option>
        <option value="size">大小</option>
        <option value="added">最近加入</option>
      </select>
      <!-- 檢視方式。預設維持方格＋分頁：那是既有的行為，把預設換掉等於
           強迫所有人適應新版面。想要瀑布流的人自己開，選擇存 localStorage。 -->
      <div class="pmode" role="group" aria-label="相片檢視方式">
        <button type="button" data-pmode="grid" class="on"
                aria-pressed="true" title="方格：裁成正方形、分頁">方格</button>
        <button type="button" data-pmode="flow"
                aria-pressed="false" title="瀑布流：原始比例、往下滑自動載入">瀑布流</button>
      </div>
    </div>
    <div class="folder-bar" id="folderBar"></div>
    <div class="section-title" id="photoTitle">相片 <span id="photoCount"></span></div>
    <div class="pgrid" id="pgrid"></div>
    <!-- 瀑布流的哨兵：捲到它就載下一頁。放在格線外面，重畫格線不會弄丟它。 -->
    <div id="pmore" hidden></div>
    <!-- 回到頂端。瀑布流沒有分頁器可以當「這一頁結束了」的錨點，
         滑了兩千張之後要回去只能一直往上滑。 -->
    <button id="pTop" class="to-top" hidden type="button" title="回到最上面">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M12 5l7 7-1.4 1.4L13 8.8V20h-2V8.8l-4.6 4.6L5 12z" fill="currentColor"/>
      </svg>
      <span>回頂端</span>
    </button>
    <div id="ppager"></div>
  </div>
</main>

<!-- 相片檢視器的 DOM 由 PhotoSwipe 自己建，這裡不需要標記 -->

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<div class="scan-panel" id="scanPanel">
  <div class="scan-h"><span class="dot" id="scanDot"></span><b id="scanPhase">掃描中</b>
    <button class="btn" id="btnCancelScan" style="padding:4px 10px">停止</button>
    <button class="btn" id="btnHideScan" style="padding:4px 10px">×</button></div>
  <div class="scan-b">
    <div id="scanText">準備中…</div>
    <div class="bar"><i id="scanBar" style="width:0"></i></div>
    <div class="scan-log" id="scanLog"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
