<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>播放中 — FilmaxWeb</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/player.css">
</head>
<body class="player">
<div class="pl" id="pl">

  <div class="pl-top" id="top">
    <a class="ib" href="/" title="返回媒體庫">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></a>
    <div class="ti"><b id="ti">載入中…</b><small id="sub"></small></div>
    <span class="tags-row" id="tags"></span>
    <span class="badge-mode" id="modePill"></span>
  </div>

  <div class="stage" id="stage">
    <video id="v" playsinline preload="metadata" crossorigin="anonymous"></video>
    <div class="subs bottom" id="subs"></div>
    <div class="tapzone" id="tap"></div>
    <div class="center" id="center"><div class="pl-card">
      <div class="spin" id="spin"></div><div id="centerText">準備中…</div>
    </div></div>
    <div class="busy" id="busy"></div>
    <div class="pl-toast" id="toast"></div>
  </div>

  <div class="ctl" id="ctl">
    <div class="bar-wrap" id="barWrap">
      <div class="bar-bg">
        <div class="bar-buf" id="barBuf"></div>
        <div class="bar-play" id="barPlay"></div>
        <div class="bar-knob" id="barKnob"></div>
      </div>
      <div class="bar-tip" id="barTip">0:00</div>
    </div>

    <div class="row">
      <button class="ib solid" id="btnPlay" title="播放 / 暫停 (空白鍵)">
        <svg viewBox="0 0 24 24" id="icPlay"><path d="M7 4l13 8-13 8z"/></svg></button>
      <button class="ib skip" id="btnBack" title="倒退 (←)">
        <svg viewBox="0 0 24 24"><path d="M11 6L4 12l7 6V6z"/><path d="M20 6l-7 6 7 6V6z"/></svg>
        <i id="skipBack">10</i></button>
      <button class="ib skip" id="btnFwd" title="快轉 (→)">
        <svg viewBox="0 0 24 24"><path d="M13 6l7 6-7 6V6z"/><path d="M4 6l7 6-7 6V6z"/></svg>
        <i id="skipFwd">10</i></button>

      <div class="vol">
        <button class="ib" id="btnMute" title="靜音 (m)">
          <svg viewBox="0 0 24 24" id="icVol"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7"/></svg></button>
        <input type="range" id="vol" min="0" max="1" step="0.02" value="1">
      </div>

      <div class="time"><span id="tCur">0:00</span><i>/</i><span id="tDur">0:00</span></div>
      <div class="grow"></div>

      <button class="ib" id="btnSubs" title="字幕 (c)">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15h4M14 15h3"/></svg></button>
      <button class="ib" id="btnSettings" title="設定">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.6 1.6 0 008 19.4a1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H2a2 2 0 110-4h.1A1.6 1.6 0 004.6 8a1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V2a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H22a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg></button>
      <button class="ib" id="btnPip" title="子母畫面">
        <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="12" width="8" height="6" rx="1"/></svg></button>
      <button class="ib" id="btnFull" title="全螢幕 (f)">
        <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 00-2 2v3M16 3h3a2 2 0 012 2v3M8 21H5a2 2 0 01-2-2v-3M16 21h3a2 2 0 002-2v-3"/></svg></button>
    </div>
  </div>

  <div class="panel" id="panel"></div>
</div>

<script src="/static/hls.min.js"></script>
<script src="/static/player.js"></script>
</body>
</html>
