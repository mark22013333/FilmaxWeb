# Flyway 設定 —— 密碼不要寫在這裡，用環境變數或 migrate.bat 帶入
#
# JDBC 連線字串說明：
#   encrypt=true                連線加密。你那台是公開 IP，這個不能關
#   trustServerCertificate=true 不驗伺服器憑證。若 MSSQL 沒有正式憑證就得開，
#                               它擋得住被動竊聽，但擋不住中間人攻擊
# your-db-host 換成你自己的 SQL Server 位址。
# 不要把真實主機位址提交進版控 —— 公開儲存庫等於公告你的資料庫在哪。
flyway.url=jdbc:sqlserver://your-db-host:1433;databaseName=filmax;encrypt=true;trustServerCertificate=true
flyway.user=filmax_flyway
# flyway.password 請用 FLYWAY_PASSWORD 環境變數傳入，不要寫在檔案裡

flyway.locations=filesystem:sql
flyway.schemas=dbo
flyway.table=filmax_schema_history
flyway.baselineOnMigrate=true
flyway.validateOnMigrate=true
flyway.cleanDisabled=true
flyway.encoding=UTF-8
